name: bndsphere

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    image: bndsphere-backend:dev
    build:
      target: dev
    read_only: false
    volumes:
      - ./backend:/backend
      - backend-venv:/backend/.venv

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend-node_modules:/app/node_modules
    networks:
      - backend-network

  caddy:
    image: bndsphere-caddy:dev
    build:
      target: dev
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./infra/Caddyfile.dev:/etc/caddy/Caddyfile:ro

  alembic-migration:
    image: bndsphere-backend:dev
    volumes:
      - ./backend:/backend
      - backend-venv:/backend/.venv

  alembic-autorevision:
    image: bndsphere-backend:dev
    volumes:
      - ./backend:/backend
      - backend-venv:/backend/.venv

  test:
    image: bndsphere-backend:dev
    profiles:
      - test
    environment:
      - CORS_ORIGIN=*
      # Object-storage settings so the test app can resolve
      # ObjectStorageServiceDep. Credentials come from the mounted secrets
      # (read via pydantic-settings secrets_dir=/run/secrets); endpoint and
      # bucket names are not secrets. Tests that exercise upload routes should
      # override ObjectStorageServiceDep directly instead of hitting a real S3.
      - OSS_ENDPOINT_URL=http://localhost:9000
      - OSS_BUCKET=test
    read_only: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
      - backend-network
    volumes:
      - ./backend:/backend
      - backend-venv:/backend/.venv
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: app_password
        target: app_password
      - source: migration_password
        target: migration_password
      - source: secret_key
        target: secret_key
      - source: oss_access_key_id
        target: oss_access_key_id
      - source: oss_access_key
        target: oss_access_key
    command: ["uv", "run", "pytest", "tests/"]

volumes:
  backend-venv:
  frontend-node_modules:
