name: Frontend checks

# The only automated gate on frontend/** was the Docker image build, which runs
# `vite build`. Vite transpiles TypeScript without type-checking it, so a type
# error could reach main unnoticed. This adds the type check plus the two
# design-token gates described in the redesign design spec, section 7.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches:
      - master
      - "release/**"
      - "design/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Gate 3 — type safety. Separate from the build on purpose: `vite build`
      # transpiles TypeScript but does not type-check it.
      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      # Gate 1 — every utility depending on our design-token namespaces must
      # resolve to a real rule in the compiled CSS. Requires the build above.
      - name: Validate design-token utilities
        run: npm run check:tokens

      # Gate 2 — raw Tailwind palette steps cannot follow the dark scheme, so
      # their count must never rise.
      - name: Check raw-palette ratchet
        run: npm run check:palette
