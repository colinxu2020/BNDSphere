name: Frontend checks

# The only automated gate on frontend/** was the Docker image build, which runs
# `vite build`. Vite transpiles TypeScript without type-checking it, so a type
# error could reach main unnoticed. This adds the type check plus the two
# design-token gates described in the redesign design spec, section 7.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches:
      - master
      - "release/**"
      - "design/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

# Least privilege, matching conventional-checks.yml and togitee.yaml. These jobs only
# ever read the checkout — nothing here writes to the repo, comments on the PR, or
# uploads results. Flagged by CodeQL on #37 (rule: workflow does not contain permissions).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Gate 3 — type safety. Separate from the build on purpose: `vite build`
      # transpiles TypeScript but does not type-check it.
      #
      # This step ran `npm run lint` until 2026-08-19, so the gate the whole point of
      # which was "the build does not type-check" was itself not type-checking. Caught
      # in review on #37. ESLint is now its own step rather than being dropped.
      - name: Type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      # Gate 1 — every utility depending on our design-token namespaces must
      # resolve to a real rule in the compiled CSS. Requires the build above.
      - name: Validate design-token utilities
        run: npm run check:tokens

      # Gate 2 — raw Tailwind palette steps cannot follow the dark scheme, so
      # their count must never rise.
      - name: Check raw-palette ratchet
        run: npm run check:palette

      # Gate 4, the automatable part — every semantic token defined in both
      # schemes, and every contrast pair the design system asserts meeting its
      # threshold. The platform matrix and type rendering still need a human.
      - name: Check scheme completeness and contrast
        run: npm run check:contrast
