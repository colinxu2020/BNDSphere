name: Sync to Gitee
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Repository to Gitee
        run: |
          git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo-mirror
          cd repo-mirror
          git remote add gitee https://oauth2:${{ secrets.GITEE_PAT }}@gitee.com/bjbnds/BNDSphere.git
          git push --prune gitee '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
