name: CI

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check app

      - name: Ruff format
        run: uv run ruff format --check app

      - name: Mypy
        run: uv run mypy app

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matches infra/Dockerfile.Caddy's `node:24-alpine` builder, so CI and the
          # image that ships are on the same major.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The three design-system gates from the redesign design spec, section 7.
      # They need the build above: all three read the compiled CSS in dist/.
      #
      # Gate 1 — every utility depending on our design-token namespaces must
      # resolve to a real rule in the compiled CSS, not silently produce nothing.
      - name: Validate design-token utilities
        run: npm run check:tokens

      # Gate 2 — raw Tailwind palette steps cannot follow the dark scheme, so
      # their count must never rise.
      - name: Check raw-palette ratchet
        run: npm run check:palette

      # Gate 4, the automatable part — every semantic token defined in both
      # schemes, and every contrast pair the design system asserts meeting its
      # threshold. The platform matrix and type rendering still need a human.
      - name: Check scheme completeness and contrast
        run: npm run check:contrast

      - name: Audit dependencies
        run: npm audit --audit-level=high
