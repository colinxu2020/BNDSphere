name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.5.0)"
        required: true
        type: string

permissions:
  contents: write

# A tag push and a manual rerun of the same version must not publish at once.
# `gh release upload --clobber` DELETES an asset before uploading its
# replacement, so two interleaved runs can leave the tarball, manifest and
# SHA256SUMS from different builds — a release the deploy script's checksum gate
# then refuses, and that no redeploy can repair without deleting assets by
# hand. Keyed by version so unrelated releases still run in parallel.
#
# ref_name, NOT ref: a tag push's github.ref is "refs/tags/v1.5.0" while a
# dispatch supplies "v1.5.0" — with `ref` those land in two different groups
# and the tag-push-racing-a-manual-rerun case (the one this exists for) is
# not serialised at all. ref_name is "v1.5.0" for a tag push, matching the
# dispatch input exactly. Residual gap: a dispatch of "1.5.0" (no leading v)
# for tag v1.5.0 still lands in its own group — expressions cannot normalise
# that; dispatch with the tag's exact name.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build once, publish to Release
    runs-on: ubuntu-latest

    steps:
      # Resolve and validate the version BEFORE checkout: on workflow_dispatch
      # the version is an input independent of the ref, and it decides what
      # gets checked out below.
      - name: Resolve version and image references
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi

          # grep -Eq matches PER LINE, so "v1.0.0\nbackend_ref=x" satisfies the
          # anchored pattern below and then injects a SECOND key=value pair
          # into $GITHUB_OUTPUT — where the last occurrence wins, and where
          # backend_ref is interpolated straight into `docker build -t` and
          # `docker save` in a job holding contents: write. The dispatch UI box
          # is single-line; the REST API is not. Reject multi-line input before
          # writing anything, the same guard lib/validate.sh applies for the
          # same reason.
          if [ "$(printf '%s' "$version" | wc -l)" -ne 0 ]; then
            echo "::error::Version must be a single line"
            exit 1
          fi

          # Same grammar the deploy script enforces. Rejecting here means a
          # malformed tag fails at release time, not on someone's deploy host.
          # No '+' build metadata: the version becomes a Docker tag verbatim
          # below, and Docker's reference grammar allows only word characters,
          # dots and dashes — v1.5.0+build.7 would pass this check and then
          # fail `docker build` with "invalid reference format".
          if ! printf '%s' "$version" \
             | grep -Eq '^v?[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version tag: $version"
            exit 1
          fi

          {
            echo "version=$version"
            echo "backend_ref=bndsphere-backend:${version}"
            echo "caddy_ref=bndsphere-caddy:${version}"
          } >> "$GITHUB_OUTPUT"

      # Check out the TAG, never the dispatch ref. actions/checkout defaults to
      # the ref the run was started from, so dispatching from master with
      # version=v1.5.0 would build master's sources, label them v1.5.0, and
      # then --clobber the real v1.5.0 assets on the existing release. For a
      # tag push refs/tags/$version is the pushed tag, so one ref serves both
      # triggers. Safe in `ref:` because the step above already rejected
      # anything outside ^v?[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.-]+)?$.
      - name: Checkout the released tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.meta.outputs.version }}

      - name: Build backend and caddy images (exactly once)
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --target prod \
            -f backend/Dockerfile \
            -t "${{ steps.meta.outputs.backend_ref }}" \
            backend

          docker build \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --target prod \
            -f infra/Dockerfile.Caddy \
            -t "${{ steps.meta.outputs.caddy_ref }}" \
            .

      - name: Capture local image digests
        id: digest
        shell: bash
        run: |
          set -euo pipefail

          backend_ref="${{ steps.meta.outputs.backend_ref }}"
          caddy_ref="${{ steps.meta.outputs.caddy_ref }}"

          # The local image ID — what `docker load` reproduces on the deploy host,
          # and what the deploy script re-checks after loading the tarball.
          backend_config_digest=$(docker image inspect --format '{{.Id}}' "$backend_ref")
          caddy_config_digest=$(docker image inspect --format '{{.Id}}' "$caddy_ref")

          for d in "$backend_config_digest" "$caddy_config_digest"; do
            case "$d" in
              sha256:*) ;;
              *) echo "::error::Expected a sha256 digest, got: $d"; exit 1 ;;
            esac
          done

          {
            echo "backend_config_digest=$backend_config_digest"
            echo "caddy_config_digest=$caddy_config_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Save the built images to a release tarball
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: no rebuild. These are the exact local images just built, which
          # is what makes the post-load digest check meaningful.
          docker save \
            "${{ steps.meta.outputs.backend_ref }}" \
            "${{ steps.meta.outputs.caddy_ref }}" \
            | gzip -9 > bndsphere-images-amd64.tar.gz

          ls -lh bndsphere-images-amd64.tar.gz

      - name: Write release manifest
        shell: bash
        run: |
          set -euo pipefail

          # HEAD, not $GITHUB_SHA: checkout above moved the worktree to the
          # requested tag, but GITHUB_SHA still names the ref the run was
          # STARTED from. On a dispatch from master for v1.5.0 that would
          # record master's commit for images built from the tag.
          jq -n \
            --arg version        "${{ steps.meta.outputs.version }}" \
            --arg built_at       "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit         "$(git rev-parse HEAD)" \
            --arg backend_ref    "${{ steps.meta.outputs.backend_ref }}" \
            --arg backend_cdig   "${{ steps.digest.outputs.backend_config_digest }}" \
            --arg caddy_ref      "${{ steps.meta.outputs.caddy_ref }}" \
            --arg caddy_cdig     "${{ steps.digest.outputs.caddy_config_digest }}" \
            '{
              version: $version,
              arch: "amd64",
              built_at: $built_at,
              commit: $commit,
              images: {
                backend: {
                  ref: $backend_ref,
                  config_digest: $backend_cdig
                },
                caddy: {
                  ref: $caddy_ref,
                  config_digest: $caddy_cdig
                }
              },
              assets: { tarball: "bndsphere-images-amd64.tar.gz" }
            }' > release-manifest.json

          cat release-manifest.json

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          # Manifest must already exist — it is covered by these sums.
          sha256sum bndsphere-images-amd64.tar.gz release-manifest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"

          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" \
              bndsphere-images-amd64.tar.gz release-manifest.json SHA256SUMS \
              --clobber
          else
            gh release create "$version" \
              --title "$version" \
              --generate-notes \
              bndsphere-images-amd64.tar.gz release-manifest.json SHA256SUMS
          fi
