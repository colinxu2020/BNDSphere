name: bndsphere

services:
  postgres:
    image: bndsphere-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=bndsphere
      - POSTGRES_USER=postgres
      - APP_DB_PASSWORD_FILE=/run/secrets/app_password
      - MIGRATION_DB_PASSWORD_FILE=/run/secrets/migration_password

    secrets:
      - postgres_password
      - app_password
      - migration_password

    volumes:
      - pgdata:/var/lib/postgresql

    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/run/postgresql:nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

    networks:
      - postgres-network

  alembic-migration:
    image: ${BACKEND_IMAGE:-bndsphere-backend}
    environment:
      - POSTGRES_USER=migration_user
      - POSTGRES_DB=bndsphere
    command: ["/backend/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    secrets:
      - source: migration_password
        target: postgres_password

  backend:
    image: ${BACKEND_IMAGE:-bndsphere-backend}
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_DB=bndsphere
      - CORS_ORIGIN=${CORS_ORIGIN}
      - OSS_ENDPOINT_URL=${OSS_ENDPOINT_URL}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_PUBLIC_BASE_URL=${OSS_PUBLIC_BASE_URL}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      alembic-migration:
        condition: service_completed_successfully
    networks:
      - postgres-network
      - backend-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    secrets:
      - source: app_password
        target: postgres_password
      - secret_key
      - oss_access_key_id
      - oss_access_key
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    volumes:
      # Read-only, and written by the deploy workflow running on the host —
      # so the backend still cannot forge deploy status, and the backend's
      # only write path to a deploy is a workflow_dispatch call to GitHub.
      - ${COMPOSE_PROJECT_DIR}/deploy/status:/srv/status:ro

  caddy:
    image: ${CADDY_IMAGE:-bndsphere-caddy}
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-network
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - caddy_data:/data
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    environment:
      - NO_PROXY=backend

  alembic-autorevision:
    image: ${BACKEND_IMAGE:-bndsphere-backend}
    profiles:
      - autorevision
    environment:
      - POSTGRES_USER=migration_user
      - POSTGRES_DB=bndsphere
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    secrets:
      - source: migration_password
        target: postgres_password

    volumes:
      - ./backend/migrations/versions:/backend/migrations/versions

    command: ["/backend/.venv/bin/alembic","revision","--autogenerate","-m","${MESSAGE:-auto revision}"]

networks:
  postgres-network:
    driver: bridge
    internal: true
  backend-network:
    driver: bridge

volumes:
  pgdata:
  caddy_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_password:
    file: ./secrets/app_db_password.txt
  migration_password:
    file: ./secrets/migration_db_password.txt
  secret_key:
    file: ./secrets/app_secret_key.txt
  oss_access_key_id:
    file: ./secrets/oss_access_key_id.txt
  oss_access_key:
    file: ./secrets/oss_access_key.txt
