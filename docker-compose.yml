name: bndsphere

services:
  postgres:
    image: bndsphere-postgres
    build:
      context: ./infra
      dockerfile: Dockerfile.Postgres
    restart: unless-stopped

    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=bndsphere
      - POSTGRES_USER=postgres
      - APP_DB_PASSWORD_FILE=/run/secrets/app_password
      - MIGRATION_DB_PASSWORD_FILE=/run/secrets/migration_password

    secrets:
      - postgres_password
      - app_password
      - migration_password

    volumes:
      - pgdata:/var/lib/postgresql

    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/run/postgresql:nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

    networks:
      - postgres-network

  alembic-migration:
    image: bndsphere-backend
    environment:
      - POSTGRES_USER=migration_user
      - POSTGRES_DB=bndsphere
    env_file:
      - .env.backend
    command: ["/backend/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    secrets:
      - source: migration_password
        target: postgres_password

  backend:
    image: bndsphere-backend
    build:
      context: ./backend
      network: host
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_DB=bndsphere
    restart: unless-stopped
    env_file:
      - .env.backend
    depends_on:
      postgres:
        condition: service_healthy
      alembic-migration:
        condition: service_completed_successfully
    networks:
      - postgres-network
      - backend-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    secrets:
      - source: app_password
        target: postgres_password
    tmpfs:
      - /tmp:noexec,nosuid,nodev

  caddy:
    image: bndsphere-caddy
    build:
      context: .
      dockerfile: infra/Dockerfile.Caddy
      network: host
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-network
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - caddy_data:/data
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    environment:
      - NO_PROXY=backend

networks:
  postgres-network:
    driver: bridge
    internal: true
  backend-network:
    driver: bridge

volumes:
  pgdata:
  caddy_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_password:
    file: ./secrets/app_db_password.txt
  migration_password:
    file: ./secrets/migration_db_password.txt
