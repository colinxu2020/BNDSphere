name: bndsphere

services:
  postgres:
    image: bndsphere-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=bndsphere
      - POSTGRES_USER=postgres
      - APP_DB_PASSWORD_FILE=/run/secrets/app_password
      - MIGRATION_DB_PASSWORD_FILE=/run/secrets/migration_password

    secrets:
      - postgres_password
      - app_password
      - migration_password

    volumes:
      - pgdata:/var/lib/postgresql

    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/run/postgresql:nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

    networks:
      - postgres-network

  alembic-migration:
    image: ${BACKEND_IMAGE:-bndsphere-backend}
    environment:
      - POSTGRES_USER=migration_user
      - POSTGRES_DB=bndsphere
    command: ["/backend/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    secrets:
      - source: migration_password
        target: postgres_password

  # One-off, runs once and exits. Fresh named volumes are created root:root
  # 0755 by the docker daemon, but backend runs as uid 1000 (backend/Dockerfile)
  # and updater runs as root (infra/Dockerfile.Updater) -- without this, backend
  # can never write into updater_request despite the mount being read-write.
  # Chowns only; the trust split itself (which service gets :ro) lives on each
  # service's own volume mount below, not here.
  state-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -e
        chown 1000:1000 /srv/request && chmod 0755 /srv/request
        chown 0:0 /srv/status && chmod 0755 /srv/status
    volumes:
      - updater_request:/srv/request
      - updater_status:/srv/status
    network_mode: "none"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true

  backend:
    image: ${BACKEND_IMAGE:-bndsphere-backend}
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_DB=bndsphere
      - CORS_ORIGIN=${CORS_ORIGIN}
      - OSS_ENDPOINT_URL=${OSS_ENDPOINT_URL}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_PUBLIC_BASE_URL=${OSS_PUBLIC_BASE_URL}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      alembic-migration:
        condition: service_completed_successfully
      state-init:
        condition: service_completed_successfully
    networks:
      - postgres-network
      - backend-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    secrets:
      - source: app_password
        target: postgres_password
      - secret_key
      - oss_access_key_id
      - oss_access_key
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    volumes:
      - updater_request:/srv/request
      - updater_status:/srv/status:ro

  caddy:
    image: ${CADDY_IMAGE:-bndsphere-caddy}
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-network
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - caddy_data:/data
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    environment:
      - NO_PROXY=backend

  updater:
    image: ${UPDATER_IMAGE:-bndsphere-updater}
    restart: unless-stopped
    # No `ports:` — this service has no listener by design (spec §7,
    # infra/Dockerfile.Updater). It only makes outbound calls: to the Docker
    # daemon over the socket below, to GHCR/GitHub for release artifacts, and
    # to backend/caddy on backend-network for readiness probes.
    depends_on:
      state-init:
        condition: service_completed_successfully
    environment:
      - COMPOSE_PROJECT_DIR=${COMPOSE_PROJECT_DIR}
    volumes:
      # The ONLY service with the Docker socket. Equivalent to root on the
      # host (spec §4) — nothing else in this file may reference it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mounted at its own absolute host path, read-only: Compose
      # resolves bind-mount sources for backend/caddy/postgres via the HOST
      # daemon when this container issues `docker compose` over the socket
      # above, so a mismatched path here would silently break those mounts
      # rather than failing loudly (see lib/state.sh's validate_startup).
      - ${COMPOSE_PROJECT_DIR}:${COMPOSE_PROJECT_DIR}:ro
      # deploy/ is where the updater persists version pins (deploy/versions.env)
      # and needs to be writable even though the rest of the project dir is ro.
      - ${COMPOSE_PROJECT_DIR}/deploy:${COMPOSE_PROJECT_DIR}/deploy
      # Trust split: the request path is backend's to write, read-only here.
      - updater_request:/srv/request:ro
      # Trust split: the status path is this service's to write; backend gets
      # it read-only. Backend must never be able to forge updater status.
      - updater_status:/srv/status
    networks:
      # For readiness probes against backend/caddy and their egress to the
      # internet (GHCR, GitHub). Never joins postgres-network.
      - backend-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev

  alembic-autorevision:
    image: ${BACKEND_IMAGE:-bndsphere-backend}
    profiles:
      - autorevision
    environment:
      - POSTGRES_USER=migration_user
      - POSTGRES_DB=bndsphere
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    secrets:
      - source: migration_password
        target: postgres_password

    volumes:
      - ./backend/migrations/versions:/backend/migrations/versions

    command: ["/backend/.venv/bin/alembic","revision","--autogenerate","-m","${MESSAGE:-auto revision}"]

networks:
  postgres-network:
    driver: bridge
    internal: true
  backend-network:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  updater_request:
  updater_status:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_password:
    file: ./secrets/app_db_password.txt
  migration_password:
    file: ./secrets/migration_db_password.txt
  secret_key:
    file: ./secrets/app_secret_key.txt
  oss_access_key_id:
    file: ./secrets/oss_access_key_id.txt
  oss_access_key:
    file: ./secrets/oss_access_key.txt
