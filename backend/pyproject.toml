[project]
name = "bndsphere"
version = "0.1.0"
description = "bnds club manage platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "fastapi-pagination>=0.15.12",
    "fastapi[standard]>=0.135.1",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "psycopg>=3.3.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.12",
    "types-passlib>=1.7.7.20260211",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests must share the fixtures' event loop; otherwise a session-scoped DB
# connection awaited from a function-scoped test loop raises
# "got Future attached to a different loop".
asyncio_default_test_loop_scope = "session"

[tool.mypy]
strict = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint]
select =["ALL"]
extend-ignore = ['EM102', 'EM101', 'TRY003', 'D107', 'D102', 'D103', 'TC001', 'D101', 'D100', 'D104', 'TC002', 'TC003', 'D205', 'D203', 'D213', 'COM812']

[tool.ruff]
extend-exclude = ["**/migrations"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "D",
    "ARG",
    "PLR2004"
]
