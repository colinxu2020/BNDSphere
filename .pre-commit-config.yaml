repos:
  - repo: local
    hooks:
      - id: black-format
        name: Format code with Black
        entry: uv --directory backend run black app
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy-check
        name: Type check with Mypy
        entry: uv --directory backend run mypy app --disallow-untyped-def
        language: system
        types: [python]
        pass_filenames: false